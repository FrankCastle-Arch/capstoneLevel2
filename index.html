<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Overlooked & Overpowered: Marvel Edition</title>
    <link rel="stylesheet" href="css/comic-ui.css">
	<link rel="stylesheet" href="css/style.css">
	</head>
<body>
	  
    <div class="comic-header-banner">Overlooked & Overpowered</div>
    <p class="tagline">Power doesn't always make the headlines.</p>
  

  <nav>
    <button class="comic-btn-block" id="roulette-tab">Roulette</button>
    <button class="comic-btn-block" id="rankings-tab">Rankings</button>
  </nav>

  <main>

    <!-- ROULETTE VIEW -->
    <section id="roulette-view">
      <div class="comic-card">
        <div class="comic-header-banner" id="char-popularity-badge">POPULARITY</div>

        <div class="comic-image-panel">
          <img id="char-image" src="" alt="">
        </div>
        <div class="comic-caption-box" id="char-name">Press the button</div>

        <p id="char-real-name"></p>
        <p id="char-first-appearance"></p>
        <p id="char-powers"></p>
        <p id="char-notable-feat"></p>
        <p id="char-why-underdog"></p>
        <p>Power level: <span id="char-power"></span></p>
      </div>

      <button class="comic-btn-block" id="roulette-button">Spin for a character</button>
    </section>

    <!-- RANKINGS VIEW -->
    <section id="rankings-view" hidden>
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="gap">Power vs. popularity gap</option>
        <option value="power">Power level</option>
        <option value="popularity">Popularity</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Power</th>
            <th>Popularity</th>
            <th>Gap</th>
          </tr>
        </thead>
        <tbody id="rankings-body">
          
        </tbody>
      </table>
      
    </section>
    </main>
  </body>
</html>
