<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Overlooked & Overpowered: Marvel Edition</title>
    <link rel="stylesheet" href="css/comic-ui.css">
	<link rel="stylesheet" href="css/style.css">
<script src="scripts/app.js" type="module"></script>
	</head>
<body>
	<img src="marvelimg1.png" alt=" vintage comic book tops" class="side-panel side-panel--left">
	<img src="marvelimg2.png" alt="superhero strips" class="side-panel side-panel--right">
	<br>
	<br> 
    <div class="comic-header-banner">Overlooked & Overpowered</div>
    <p class="tagline">Power doesn't always make the headlines.</p>
  

  <nav>
    <button class="comic-btn-block" id="roulette-tab">Roulette</button>
    <button class="comic-btn-block" id="rankings-tab">Rankings</button>
  </nav>

  <main>

    <!-- ROULETTE VIEW -->
    <section id="roulette-view">
		<br>
		<br>
		<br>
		<br>
	  <div class="comic-card" id="intro-card">
		
		  <div class="k-speech-bubble">DID YOU KNOW?</div>
			<center>
			
		    <br>			
			<p>50 Marvel characters. <br>
			Some can level cities. <br>
			Most fans have never heard their name.</p>
			</center>
	  </div>

      <div class="comic-card"  id="character-card" hidden>
        <div class="comic-header-banner" id="char-popularity-badge">POPULARITY</div>

        <div class="comic-image-panel">
          <span id="char-icon"></span>
        </div>
        <div class="comic-caption-box" id="char-name">Press the button</div>

        <p id="char-real-name"></p>
		<p><a id="char-link" href="" target="_blank" rel="noopener noreferrer">Learn more about this character</a></p>
        <p id="char-first-appearance"></p>
        <p id="char-powers"></p>
        <p id="char-notable-feat"></p>
        <p id="char-why-underdog"></p>
        <p>Power level: <span id="char-power"></span></p>
      </div>

      <button class="comic-btn-block" id="roulette-button" hidden>Spin for a character</button>
    </section>

    <!-- RANKINGS VIEW -->
	<center>
    <section id="rankings-view" hidden>
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="gap">Power vs. popularity gap</option>
        <option value="power">Power level</option>
        <option value="popularity">Popularity</option>
      </select>
	
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Power</th>
            <th>Popularity</th>
            <th>Gap</th>
          </tr>
        </thead>
        <tbody id="rankings-body">
          
        </tbody>
      </table>
      </center>
    </section>
    </main>
  </body>
</html>
